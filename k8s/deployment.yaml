apiVersion: apps/v1
kind: Deployment
metadata:
  name: agile7stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agile7stage
  template:
    metadata:
      labels:
        app: agile7stage
    spec:
      containers:
        - name: agile7stage
          image: YOUR_DOCKERHUB_USERNAME/agile7stage:REPLACE_WITH_COMMIT_SHA
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
