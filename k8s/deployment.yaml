apiVersion: apps/v1
kind: Deployment
metadata:
  name: agile7stage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agile7stage
  template:
    metadata:
      labels:
        app: agile7stage
    spec:
      containers:
        - name: agile7stage
          image: mahesh2024p/agile7stage:3a76afae0f4f91628bfa75b04b0cf1973b87b777
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5

